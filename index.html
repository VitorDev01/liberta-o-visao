<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galeria Embaralhada</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    align-items:center;
    gap:25px;
    font-family:Arial, sans-serif;
    background:
    linear-gradient(
        to bottom,
        #1b2735 0%,
        #2a3f5f 35%,
        #3b1d59 65%,
        #12071f 100%
    );

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.galeria{
    display:grid;

    grid-template-columns:auto auto;

    grid-template-areas:
        "c1 c2"
        "c5 c5"
        "c3 c4";

    justify-content:center;
    align-items:center;

    column-gap:60px;
    row-gap:25px;
}

.c1{grid-area:c1;}
.c2{grid-area:c2;}
.c3{grid-area:c3;}
.c4{grid-area:c4;}

.c5{
    grid-area:c5;
    justify-self:center;
}

.galeria img{
    width:140px;
    height:205px;
    object-fit:cover;

    border-radius:12px;
    
    box-shadow:
        0 4px 10px rgba(0,0,0,.5),
        0 0 15px rgba(255,255,255,.15);

    animation:pulse 1.5s ease-in-out infinite;
    transition:opacity .2s ease;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.02);
    }
}

button{
    padding:14px 30px;
    font-size:18px;
    font-weight:bold;
    border:none;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
}

@media(max-width:500px){

    .galeria{
        column-gap:20px;
        row-gap:15px;
    }

    .galeria img{
        width:110px;
        height:160px;
    }

    button{
        width:90%;
    }
}
</style>
</head>
<body>

<div class="galeria">
    <img id="foto1" class="c1">
    <img id="foto2" class="c2">

    <img id="foto5" class="c5">

    <img id="foto3" class="c3">
    <img id="foto4" class="c4">
</div>

<button id="embaralhar">
Ver Espiritual
</button>

<script>
const fotos = [];

// 1.jpg até 14.jpg
for(let i = 1; i <= 20; i++){
    fotos.push(`${i}.jpg`);
}

const quadros = [
    document.getElementById("foto1"),
    document.getElementById("foto2"),
    document.getElementById("foto3"),
    document.getElementById("foto4"),
    document.getElementById("foto5")
];

function embaralharFotos(){

    quadros.forEach(quadro => {

        const indice = Math.floor(
            Math.random() * fotos.length
        );

        quadro.style.opacity = "0";

        setTimeout(() => {
            quadro.src = fotos[indice];
            quadro.style.opacity = "1";
        }, 150);

    });
}

document
.getElementById("embaralhar")
.addEventListener("click", embaralharFotos);

embaralharFotos();
</script>

</body>
</html>
